<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kitty Party Picker 🎉</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="app-header">
    <h1>🎀 Kitty Party Picker</h1>
    <p class="tagline">Add your members, drop the chits, and let luck decide the lucky winner!</p>
  </header>

  <main class="layout">
    <!-- Left: Add candidates -->
    <section class="panel entry-panel">
      <h2><span class="step-num">1</span> Add Members</h2>

      <form id="add-form" class="add-form" autocomplete="off">
        <input
          id="name-input"
          type="text"
          placeholder="Enter a name…"
          maxlength="24"
          aria-label="Candidate name"
        />
        <button type="submit" class="btn btn-add" id="add-btn">＋ Add</button>
      </form>

      <div class="names-header">
        <span id="count-label">0 members</span>
        <button type="button" class="link-btn" id="clear-btn" hidden>Clear all</button>
      </div>

      <ul id="names-list" class="names-list" aria-live="polite"></ul>

      <div class="entry-hint" id="entry-hint">
        Add at least 2 members to start the draw.
      </div>
    </section>

    <!-- Right: The box + drawing -->
    <section class="panel stage-panel">
      <h2><span class="step-num">2</span> The Lucky Draw</h2>

      <div class="box-wrap">
        <!-- Transparent box -->
        <div class="glass-box" id="glass-box" aria-label="Transparent box of chits">
          <div class="box-lid"></div>
          <div class="chits-heap" id="chits-heap"></div>
          <div class="box-shine"></div>
          <div class="box-front"></div>
        </div>
        <div class="box-shadow"></div>
      </div>

      <div class="controls">
        <button type="button" class="btn btn-fill" id="fill-btn" disabled>
          📝 Drop chits in box
        </button>
        <button type="button" class="btn btn-pick" id="pick-btn" disabled>
          🎲 Pick a winner!
        </button>
      </div>

      <p class="stage-status" id="stage-status">Add members to begin.</p>
    </section>
  </main>

  <!-- Winner reveal overlay -->
  <div class="reveal-overlay" id="reveal-overlay" aria-hidden="true">
    <canvas id="confetti-canvas"></canvas>
    <div class="reveal-card" id="reveal-card">
      <div class="reveal-eyebrow">🎊 The lucky winner is 🎊</div>
      <div class="winner-name" id="winner-name">—</div>
      <div class="gold-bag" id="gold-bag">
        <div class="bag-body">
          <div class="bag-tie"></div>
          <div class="bag-symbol">₹</div>
          <div class="bag-tag" id="bag-tag">—</div>
        </div>
        <div class="coin-pile">
          <span class="coin"></span><span class="coin"></span><span class="coin"></span>
          <span class="coin"></span><span class="coin"></span>
        </div>
      </div>
      <button type="button" class="btn btn-again" id="again-btn">Draw again 🔄</button>
    </div>
  </div>

  <div class="money-layer" id="money-layer" aria-hidden="true"></div>

  <footer class="app-footer">Made with 💖 for kitty parties</footer>

  <script src="app.js"></script>
</body>
</html>
